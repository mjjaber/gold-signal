<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0f14">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self' https://api.gold-api.com https://api.coingecko.com; img-src 'self' data:; base-uri 'none'; form-action 'none'">
<title>Gold Doctor Signal</title>
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%F0%9F%AA%99%3C/text%3E%3C/svg%3E">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%F0%9F%AA%99%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --bg:#0d0f14; --card:#161a22; --card2:#1e232d; --line:#2a3140;
    --txt:#e8ecf3; --dim:#8a94a6;
    --buy:#22c55e; --sell:#ef4444; --hold:#eab308; --gold:#f5c451; --blue:#60a5fa;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--bg); color:var(--txt);
    font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    padding:16px 16px calc(28px + env(safe-area-inset-bottom));
    max-width:640px; margin:0 auto; -webkit-text-size-adjust:100%;
  }
  header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
  h1{font-size:16px;font-weight:600;letter-spacing:.3px}
  h1 span{color:var(--gold)}
  .tf{display:flex;gap:4px;background:var(--card);border-radius:10px;padding:3px;flex:none}
  .tf button{
    background:none;border:0;color:var(--dim);font:600 13px/1 inherit;
    padding:9px 13px;border-radius:8px;cursor:pointer
  }
  .tf button[aria-pressed="true"]{background:var(--card2);color:var(--txt)}

  .hero{
    background:linear-gradient(160deg,#1a2030,#161a22);border:1px solid var(--line);
    border-radius:18px;padding:18px;margin-top:14px
  }
  .hero h2{font-size:11px;font-weight:600;color:var(--gold);text-transform:uppercase;
    letter-spacing:1.4px;margin-bottom:10px}
  .hero .read{font-size:15px;line-height:1.55;color:var(--txt)}
  .hero .read b{color:var(--gold);font-weight:700}
  .cone{margin-top:16px}
  .cone .row{margin-bottom:13px}
  .cone .lab{display:flex;justify-content:space-between;font-size:11.5px;color:var(--dim);margin-bottom:5px}
  .cone .lab b{color:var(--txt);font-variant-numeric:tabular-nums;font-weight:700}
  .bar{position:relative;height:22px;border-radius:6px;background:var(--card2);overflow:hidden}
  .bar .span{position:absolute;top:0;bottom:0;background:linear-gradient(90deg,
    rgba(239,68,68,.55),rgba(234,179,8,.45),rgba(34,197,94,.55))}
  .bar .mid{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--txt)}
  .bar .now{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--gold)}
  .ends{display:flex;justify-content:space-between;font-size:10.5px;color:var(--dim);
    margin-top:4px;font-variant-numeric:tabular-nums}
  .caveat{margin-top:14px;padding-top:13px;border-top:1px solid var(--line);
    font-size:12px;color:var(--dim);line-height:1.6}
  .stale{
    background:#3a2a12;border:1px solid #6b4d1c;border-radius:12px;padding:12px 14px;
    margin-bottom:14px;font-size:13px;line-height:1.5;color:#f0d9a8
  }
  .stale b{color:var(--gold)}
  .fresh{font-size:11px;color:var(--dim);text-align:center;margin-bottom:12px}
  .hdr{display:flex;align-items:center;gap:8px;flex:none}
  .refresh{
    background:var(--card);border:1px solid var(--line);color:var(--dim);
    width:38px;height:38px;border-radius:10px;font-size:17px;line-height:1;
    cursor:pointer;flex:none
  }
  .refresh:active{opacity:.6}
  .refresh[data-busy="1"]{color:var(--gold);animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .toast{
    position:fixed;left:50%;bottom:24px;transform:translateX(-50%);
    background:var(--card2);color:var(--txt);border:1px solid var(--line);
    padding:11px 16px;border-radius:10px;font-size:13px;z-index:9;
    box-shadow:0 6px 24px rgba(0,0,0,.45);max-width:88vw;text-align:center
  }
  .prices{margin-top:18px;display:flex;flex-direction:column;gap:8px}
  .prow{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    background:var(--card2);border:1px solid var(--line);border-radius:12px;
    padding:11px 14px;text-align:left
  }
  .prow.bull{border-color:rgba(34,197,94,.45);background:rgba(34,197,94,.10)}
  .prow .lbl{font-size:10.5px;letter-spacing:1px;text-transform:uppercase;color:var(--dim)}
  .prow .sub2{font-size:10.5px;color:var(--dim);margin-top:2px}
  .prow .val{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
  .prow .right{text-align:right}
  .pchg{font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px}
  .spread{font-size:11px;color:var(--dim);text-align:center;margin-top:8px}
  .zbar{position:relative;height:34px;border-radius:8px;overflow:hidden;margin:12px 0 6px;
    background:linear-gradient(90deg,rgba(239,68,68,.30),rgba(234,179,8,.22) 45%,
    rgba(234,179,8,.22) 55%,rgba(34,197,94,.34))}
  .zbar .mk{position:absolute;top:-3px;bottom:-3px;width:3px;background:var(--txt)}
  .zbar .cut{position:absolute;top:0;bottom:0;width:1px;background:rgba(255,255,255,.30)}
  .zends{display:flex;justify-content:space-between;font-size:10.5px;color:var(--dim)}
  .zhead{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
  .zhead b{font-size:20px;font-weight:800;letter-spacing:-.3px}
  .verdict{
    border-radius:18px;padding:26px 20px;text-align:center;
    background:var(--card);border:1px solid var(--line);position:relative;overflow:hidden
  }
  .verdict::before{content:"";position:absolute;inset:0;opacity:.12;background:var(--vc)}
  .verdict > *{position:relative}
  .call{font-size:clamp(44px,15vw,64px);font-weight:800;letter-spacing:-1px;color:var(--vc);line-height:1.05}
  .sub{color:var(--dim);font-size:12px;margin-top:6px;text-transform:uppercase;letter-spacing:1.2px}
  .price{font-size:30px;font-weight:700;margin-top:16px;font-variant-numeric:tabular-nums}
  .chg{font-size:14px;font-weight:600;margin-top:2px;font-variant-numeric:tabular-nums}
  .up{color:var(--buy)} .down{color:var(--sell)}
  .flags{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:14px}
  .flag{
    font-size:11px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;
    padding:5px 10px;border-radius:999px;background:var(--card2);color:var(--dim)
  }
  .why{
    margin-top:16px;padding-top:14px;border-top:1px solid var(--line);
    color:var(--dim);font-size:14px;text-align:left
  }

  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:14px}
  .card h2{font-size:11.5px;font-weight:600;color:var(--dim);text-transform:uppercase;letter-spacing:1.2px;margin-bottom:12px}
  svg{width:100%;display:block}
  .legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px;font-size:11.5px;color:var(--dim)}
  .legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:middle}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  .stat{background:var(--card2);border-radius:11px;padding:11px 13px}
  .stat b{display:block;font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px}
  .stat i{font-style:normal;font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.8px}
  .stat small{display:block;font-size:11px;color:var(--dim);margin-top:2px}

  table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
  th,td{text-align:right;padding:9px 3px;font-size:13px;border-bottom:1px solid var(--line)}
  th:first-child,td:first-child{text-align:left}
  thead th{font-size:10.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.8px;font-weight:600}
  tbody tr:last-child td{border-bottom:0}
  td b{font-weight:700}
  .verdictline{margin-top:12px;font-size:13px;color:var(--dim);line-height:1.55}
  .verdictline b{color:var(--txt);font-weight:600}

  .heat{width:100%;border-collapse:separate;border-spacing:2px;font-variant-numeric:tabular-nums}
  .heat th{font-size:10px;color:var(--dim);font-weight:600;padding:2px;letter-spacing:.5px}
  .heat td{
    text-align:center;font-size:10.5px;font-weight:600;padding:7px 2px;
    border-radius:5px;color:#0d0f14;background:var(--card2)
  }
  .heat td.na{background:transparent}
  .heat td.live{outline:2px solid var(--gold);outline-offset:-2px;color:#0d0f14}
  .axis{font-size:10.5px;color:var(--dim);text-align:center;margin-top:8px;letter-spacing:.5px}
  .btn{
    display:inline-block;background:var(--card2);color:var(--txt);border:1px solid var(--line);
    font:600 13px/1 inherit;padding:11px 15px;border-radius:10px;cursor:pointer
  }
  .btn.primary{background:var(--gold);color:#0d0f14;border-color:var(--gold)}
  .btn:active{opacity:.7}
  .btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
  .log{list-style:none}
  .log li{padding:11px 0;border-bottom:1px solid var(--line);font-size:13px}
  .log li:last-child{border-bottom:0}
  .log .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
  .log .when{color:var(--dim);font-size:11.5px}
  .log .res{margin-top:5px;color:var(--dim);font-size:12px;font-variant-numeric:tabular-nums}
  .tag{font-size:9.5px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;
    padding:2px 6px;border-radius:4px;background:var(--card2);color:var(--dim);margin-left:6px}
  .ok{color:var(--buy)} .bad{color:var(--sell)} .pend{color:var(--hold)}
  .other{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .pill{font-weight:700;font-size:14px;padding:6px 13px;border-radius:999px;background:var(--card2)}
  footer{margin-top:20px;color:var(--dim);font-size:11.5px;line-height:1.6;text-align:center}
  footer b{color:#9aa5b8;font-weight:600}
  .err{text-align:center;padding:32px 0;color:var(--sell)}
</style>
</head>
<body>
<header>
  <h1>GOLD <span>DOCTOR</span> SIGNAL</h1>
  <div class="hdr">
    <div class="tf" id="tf">
      <button type="button" data-k="weekly" aria-pressed="true">Weekly</button>
      <button type="button" data-k="daily" aria-pressed="false">Daily</button>
    </div>
    <button type="button" id="refresh" class="refresh" title="Pull the latest published data"
      aria-label="Refresh">&#10227;</button>
  </div>
</header>

<main id="app"><div class="err" style="color:var(--dim)">Loading&hellip;</div></main>

<footer>
  <div id="meta"></div>
  <div style="margin-top:8px" id="rule"></div>
  <div style="margin-top:8px">A technical-indicator readout, not financial advice.
  Backtests exclude costs and slippage, and past behaviour is not a forecast.</div>
</footer>

<script>
var COLOR = {BUY:'var(--buy)', SELL:'var(--sell)', HOLD:'var(--hold)'};
var FLAGS = {
  'regime-veto-buy':  'Regime veto · below 50MA',
  'regime-veto-sell': 'Regime veto · above 50MA',
  'momentum-strong':  'Strong momentum · confirming',
  'momentum-weak':    'Weak momentum · worse setup'
};
var DATA = null, KEY = 'weekly';

function esc(v){
  return String(v === null || v === undefined ? '' : v)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function safeVerdict(v){
  return (v === 'BUY' || v === 'SELL' || v === 'HOLD') ? v : 'HOLD';
}

function F(n, d){
  if (n === null || n === undefined) return '–';
  d = d === undefined ? 2 : d;
  return n.toLocaleString('en-US', {minimumFractionDigits:d, maximumFractionDigits:d});
}
function pct(n){ return n === null || n === undefined ? '–' : (n > 0 ? '+' : '') + F(n) + '%'; }

function toast(msg){
  var t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(function(){ t.remove(); }, 3600);
}

// Live spot bullion. This is the only price feed that both permits browser
// access (CORS) and is allowed by the page's CSP -- Yahoo and Swissquote send no
// CORS headers, so the futures print cannot be refreshed from here and stays at
// whatever the last build published.
var LIVE = null;

// Both of these send CORS headers and are allowed by the CSP. PAXG is a token
// redeemable for allocated bullion, so it stands in acceptably when the primary
// feed is down -- flagged as a fallback because it carries its own premium.
var LIVE_FEEDS = [
  {name: 'gold-api', url: 'https://api.gold-api.com/price/XAU',
   pick: function(d){ return Number(d && d.price); }},
  {name: 'PAXG', url: 'https://api.coingecko.com/api/v3/simple/price?ids=pax-gold&vs_currencies=usd',
   pick: function(d){ return Number(d && d['pax-gold'] && d['pax-gold'].usd); }, fallback: true}
];

function pullLiveBullion(k){
  k = k || 0;
  if (k >= LIVE_FEEDS.length) return Promise.resolve(null);
  var f = LIVE_FEEDS[k];
  return fetch(f.url, {cache: 'no-store'})
    .then(function(r){ return r.ok ? r.json() : Promise.reject('HTTP ' + r.status); })
    .then(function(d){
      var px = f.pick(d);
      if (!(px > 100 && px < 100000)) throw 'implausible price';
      LIVE = {price: px, at: Math.floor(Date.now() / 1000), source: f.name,
              fallback: !!f.fallback};
      return LIVE;
    })
    .catch(function(){ return pullLiveBullion(k + 1); });
}

function pull(announce){
  var btn = document.getElementById('refresh');
  if (btn && btn.dataset.busy === '1') return;
  if (btn) btn.dataset.busy = '1';
  var before = DATA ? DATA.generated : 0;
  var beforePx = LIVE ? LIVE.price : null;
  // cache: 'no-store' plus a cache-busting query, because the CDN will happily
  // serve the copy this page already has otherwise.
  return fetch('data.json?t=' + Date.now(), {cache: 'no-store'})
    .then(function(r){ return r.ok ? r.json() : Promise.reject('HTTP ' + r.status); })
    .then(function(d){ DATA = d; return pullLiveBullion(); })
    .then(function(){
      var d = DATA;
      render();
      if (announce){
        // The page can only re-pull what the builder last published; it cannot
        // rebuild it. Say which of those happened rather than implying a fetch
        // of live market data.
        var bits = [];
        if (LIVE){
          bits.push(beforePx && Math.abs(LIVE.price - beforePx) > 0.005
            ? 'Bullion $' + F(LIVE.price) + ' (' +
              (LIVE.price > beforePx ? '+' : '\u2212') + F(Math.abs(LIVE.price - beforePx)) + ')'
            : 'Bullion $' + F(LIVE.price) + ' live');
        } else {
          bits.push('Live bullion feed unreachable');
        }
        bits.push(d.generated > before ? 'new build pulled' : 'analysis unchanged');
        toast(bits.join(' \u00b7 '));
      }
    })
    .catch(function(e){
      if (announce) toast('Refresh failed (' + e + ')');
      else document.getElementById('app').innerHTML =
        '<div class="err">Could not load data.json (' + e + ').<br>The updater may not have run yet.</div>';
    })
    .then(function(){ if (btn) btn.dataset.busy = '0'; });
}

pull(false);

document.getElementById('refresh').addEventListener('click', function(){ pull(true); });

// Coming back to the tab after a while should not show a stale page silently.
document.addEventListener('visibilitychange', function(){
  if (!document.hidden && DATA && (Date.now() / 1000 - DATA.generated) > 3600) pull(false);
});

document.getElementById('tf').addEventListener('click', function(e){
  var b = e.target.closest('button');
  if (!b) return;
  KEY = b.dataset.k;
  Array.prototype.forEach.call(this.children, function(x){
    x.setAttribute('aria-pressed', x === b ? 'true' : 'false');
  });
  render();
});

function render(){
  if (!DATA) return;
  var s = DATA[KEY];
  var o = DATA[KEY === 'weekly' ? 'daily' : 'weekly'];
  var otherName = KEY === 'weekly' ? 'Daily' : 'Weekly';
  var bar = KEY === 'weekly' ? 'week' : 'day';
  var d = s.detail;
  var chg = s.last - s.prev, cp = chg / s.prev * 100;

  var flags = (s.notes || []).map(function(n){
    return '<span class="flag">' + (FLAGS[n] || esc(n)) + '</span>';
  }).join('');
  var regimeFlag = '<span class="flag" style="color:' +
    (d.regime === 'uptrend' ? 'var(--buy)' : 'var(--sell)') + '">' +
    (d.regime === 'uptrend' ? '▲' : '▼') + ' ' + d.regime +
    ' · ' + pct(d.maGap) + ' vs 50MA</span>';

  document.getElementById('app').innerHTML =
    freshness() +
    '<section class="verdict" style="--vc:' + COLOR[s.verdict] + '">' +
      '<div class="call">' + s.verdict + '</div>' +
      '<div class="sub">' + KEY + ' &middot; ' +
        (s.asOf ? 'as of ' + fmtDate(s.asOf) + ' close' : 'gold') +
        (s.raw !== s.verdict ? ' &middot; MACD alone said ' + s.raw : '') + '</div>' +
      priceRows(s, bar, chg, cp) +
      '<div class="flags">' + regimeFlag + flags + provisionalFlag(s) + '</div>' +
      '<div class="why">' + s.why + '</div>' +
    '</section>' +

    hero(s, bar) +
    basisCard() +

    '<section class="card"><h2>Price vs 50-' + bar + ' average · last ' +
      s.candles.length + ' ' + bar + 's</h2>' + priceChart(s.candles) +
      '<div class="legend"><span><i style="background:var(--gold)"></i>Close</span>' +
      '<span><i style="background:var(--blue)"></i>50 ' + bar + ' MA</span></div>' +
    '</section>' +

    '<section class="card"><h2>MACD histogram</h2>' + histChart(s.candles) +
      '<div class="legend">' +
        '<span><i style="background:var(--blue)"></i>MACD</span>' +
        '<span><i style="background:#f59e0b"></i>Signal</span>' +
        '<span><i style="background:var(--buy)"></i>Positive</span>' +
        '<span><i style="background:var(--sell)"></i>Negative</span>' +
      '</div></section>' +

    '<section class="card"><h2>Readings</h2><div class="grid">' +
      stat('MACD line', F(d.macd)) +
      stat('Signal line', F(d.signal)) +
      stat('Histogram', F(d.hist), d.hist >= 0 ? 'var(--buy)' : 'var(--sell)') +
      stat('RSI ' + DATA.params.rsi, F(d.rsi, 1),
           d.rsi >= 70 ? 'var(--buy)' : d.rsi <= 30 ? 'var(--sell)' : null,
           d.rsi >= 70 ? 'strong momentum' : d.rsi <= 30 ? 'weak momentum' : 'neutral') +
      stat('50-' + bar + ' MA', '$' + F(d.ma, 0)) +
      stat('Since MACD cross', d.crossAge + ' ' + bar + (d.crossAge === 1 ? '' : 's')) +
    '</div></section>' +

    proximity(s, bar) +
    trackRecord(s, bar) +
    heatmap(s) +
    scorecard(s, bar) +
    learning(s, bar) +
    saved(s, bar) +

    '<section class="card other">' +
      '<div><div style="font-size:11.5px;color:var(--dim);letter-spacing:1.1px;text-transform:uppercase">' +
        otherName + ' check</div>' +
        '<div style="font-size:13px;color:var(--dim);margin-top:3px">' +
          (o.verdict === s.verdict ? 'Agrees with the ' + KEY + ' call.'
                                   : 'Disagrees — the timeframes are out of sync.') +
        '</div></div>' +
      '<div class="pill" style="color:' + COLOR[o.verdict] + '">' + o.verdict + '</div>' +
    '</section>';

  var p = DATA.params;
  document.getElementById('rule').innerHTML =
    'MACD <b>' + p.fast + '/' + p.slow + '/' + p.signal + '</b> on close, vetoed by the <b>' +
    p.ma + '-bar MA</b>, flagged by <b>RSI ' + p.rsi + '</b> · ' +
    'signal computed on COMEX futures (Yahoo Finance); spot bullion shown for reference only \u00b7 rebuilt by GitHub Actions';
  var when = new Date(DATA.generated * 1000);
  document.getElementById('meta').textContent = s.source + ' · updated ' +
    when.toLocaleString('en-US', {month:'short', day:'numeric', hour:'numeric', minute:'2-digit'});
}

function stat(label, value, color, note){
  return '<div class="stat"><i>' + label + '</i><b' +
    (color ? ' style="color:' + color + '"' : '') + '>' + value + '</b>' +
    (note ? '<small>' + note + '</small>' : '') + '</div>';
}

function trackRecord(s, bar){
  var t = s.test;
  if (!t || !t.bars) return '';
  var row = function(name, r, note){
    var opt = (r.cagrNoLag !== null && r.cagrNoLag !== undefined && r.cagr !== null &&
               Math.abs(r.cagrNoLag - r.cagr) > 0.05)
      ? '<br><small style="color:var(--dim)">' + pct(r.cagrNoLag) + ' if filled same bar</small>' : '';
    return '<tr><td>' + name + (note ? '<br><small style="color:var(--dim)">' + note + '</small>' : '') +
      '</td><td><b>' + pct(r.cagr) + '</b>' + opt + '</td><td style="color:var(--sell)">' + pct(r.maxDD) +
      '</td><td>' + r.exposure + '%</td></tr>';
  };
  var pos = t.position, hold = t.hold;
  var beat = pos.cagr !== null && hold.cagr !== null && pos.cagr >= hold.cagr;
  var safer = pos.maxDD !== null && hold.maxDD !== null && pos.maxDD > hold.maxDD;

  var line;
  if (beat && safer) line = 'Over this window the rule beat buy-and-hold on both return and drawdown.';
  else if (safer) line = 'The rule <b>lagged buy-and-hold on return</b> but took a shallower worst drawdown — ' +
    'it trades upside for a smoother ride.';
  else if (beat) line = 'The rule out-returned buy-and-hold, but rode an equally deep drawdown.';
  else line = 'Over this window the rule <b>did not beat simply holding gold</b>, on return or on drawdown. ' +
    'Gold spent most of these years trending up, which is the regime trend-following gives back the most in.';

  return '<section class="card"><h2>Track record · ' + t.years + ' years, ' +
    t.bars + ' ' + bar + 's</h2>' +
    '<table><thead><tr><th>Rule</th><th>CAGR</th><th>Max DD</th><th>In market</th></tr></thead><tbody>' +
      row('Position', pos, 'BUY until SELL, HOLD sits tight') +
      row('Literal signal', t.signal, 'long only while the light says BUY') +
      row('Buy &amp; hold', hold, 'never sell') +
    '</tbody></table>' +
    '<div class="verdictline">' + line + '<br>' +
    pos.n + ' completed BUY trades, ' + (pos.winRate === undefined ? '–' : pos.winRate + '%') +
    ' of them profitable, averaging ' + pct(pos.avg) + ' over ' + pos.avgBars + ' ' + bar + 's ' +
    '(best ' + pct(pos.best) + ', worst ' + pct(pos.worst) + ').' + '<br><br>Signals are filled one bar after they fire, because the close that produces a signal is not known until the bar has closed. Filling on the signal bar itself flatters the weekly position rule by 1.4 points of CAGR. No commission or spread is modelled.</div>' +
    '</section>';
}

function chgChip(price, prev, label){
  // Each leg is compared with its own previous settled value, never with the
  // other leg -- futures against the prior settle, bullion against the last fix.
  if (!prev || !price) return '';
  var d = price - prev, pc = d / prev * 100;
  var cls = d >= 0 ? 'up' : 'down';
  return '<div class="pchg ' + cls + '">' + (d >= 0 ? '\u25b2 ' : '\u25bc ') +
    F(Math.abs(d)) + '  ' + (d >= 0 ? '+' : '\u2212') + F(Math.abs(pc)) + '%' +
    '<div style="font-size:10px;font-weight:400;color:var(--dim)">vs ' + label + '</div></div>';
}

function priceRows(s, bar, chg, cp){
  var b = DATA.bullion;
  var q = DATA.quotes || {};
  var chgHtml = '<div class="chg ' + (chg >= 0 ? 'up' : 'down') + '">' +
    (chg >= 0 ? '\u25b2 ' : '\u25bc ') + F(Math.abs(chg)) +
    ' (' + (cp >= 0 ? '+' : '\u2212') + F(Math.abs(cp)) + '%) in the ' + bar +
    ' to ' + fmtDate(s.asOf) + '</div>';

  var fq = q.futures || {};
  var rows =
    '<div class="prow">' +
      '<div><div class="lbl">Futures</div>' +
        '<div class="sub2">' + esc(fq.exchange || s.source || 'COMEX') +
          (fq.symbol ? ' \u00b7 ' + esc(fq.symbol) : '') +
          ' \u00b7 last build \u00b7 ' + agoText(DATA.generated) + '</div></div>' +
      '<div class="right"><div class="val">$' + F(DATA.spot) + '</div>' +
        chgChip(DATA.spot, fq.prev, fq.prevLabel || 'prior settle') + '</div>' +
    '</div>';

  var px = LIVE ? LIVE.price : (b && b.price);
  var srcTxt = LIVE
    ? 'spot XAU/USD \u00b7 live \u00b7 ' + esc(LIVE.source) +
      (LIVE.fallback ? ' (backup)' : '') + ' \u00b7 ' + agoText(LIVE.at)
    : (b ? 'spot XAU/USD \u00b7 ' + esc(b.source) : '');
  var bq = q.bullion || {};
  if (px){
    rows +=
      '<div class="prow bull">' +
        '<div><div class="lbl" style="color:var(--buy)">Bullion</div>' +
          '<div class="sub2">' + srcTxt + '</div></div>' +
        '<div class="right"><div class="val" style="color:var(--buy)">$' + F(px) + '</div>' +
          chgChip(px, bq.prev, bq.prevLabel || 'LBMA fix') + '</div>' +
      '</div>';
  }

  // The gap is the interesting part: it is the future's financing premium, not
  // a disagreement between the two feeds.
  // The futures leg cannot be refreshed in the browser, so a live bullion price
  // against a stale settle would print a carry number that means nothing.
  var futAge = (Date.now() / 1000 - DATA.generated) / 3600;
  var spread = '';
  if (px && futAge < 6){
    var prem = (DATA.spot - px) / px * 100;
    spread = '<div class="spread">Futures trade ' + (prem >= 0 ? '+' : '') + F(prem) + '% ' +
      (prem >= 0 ? 'above' : 'below') + ' spot \u2014 $' + F(Math.abs(DATA.spot - px), 0) +
      ' of carry</div>';
  } else if (px){
    spread = '<div class="spread">Futures print is ' + Math.round(futAge) +
      'h old \u2014 carry needs both legs quoted together</div>';
  }

  return '<div class="prices">' + rows + '</div>' + spread + chgHtml;
}

function agoText(ts){
  var m = Math.max(0, Math.round((Date.now() / 1000 - ts) / 60));
  return m < 1 ? 'just now' : m < 60 ? m + ' min ago' : Math.round(m / 60) + ' h ago';
}

function freshness(){
  // The data only moves when the builder runs. If that has not happened for a
  // while the page looks alive but is not, so say so rather than let a stale
  // price pass for a current one.
  var hours = (Date.now() / 1000 - DATA.generated) / 3600;
  if (hours < 26){
    return '<div class="fresh">Data rebuilt ' +
      (hours < 1 ? Math.round(hours * 60) + ' min' : Math.round(hours) + ' h') + ' ago</div>';
  }
  var days = Math.floor(hours / 24);
  return '<div class="stale"><b>This data is ' + days + ' day' + (days === 1 ? '' : 's') +
    ' old.</b> Prices and every number below are frozen at the last rebuild — nothing here ' +
    'reflects today. The scheduled updater has not run.</div>';
}

function provisionalFlag(s){
  if (!s.forming || !s.provisional) return '';
  var p = s.provisional, same = p.verdict === s.verdict;
  return '<span class="flag" style="color:' + (same ? 'var(--dim)' : 'var(--hold)') + '">' +
    'this ' + (KEY === 'weekly' ? 'week' : 'day') + ' so far: ' + p.verdict +
    (same ? '' : ' (unconfirmed)') + '</span>';
}

function hero(s, bar){
  var o = s.outlook, d = s.detail;
  if (!o || !o.bands) return '';
  var unit = bar === 'week' ? 'w' : 'd';
  // Bands are measured from closes, so the projection anchors to the last
  // completed close. The live tick is shown alongside, not used as the base.
  var spot = (DATA.anchor && DATA.anchor[KEY]) || DATA.spot;

  // Plain-language momentum read, assembled from what was actually measured.
  var dirn = {BUY: 'building to the upside', SELL: 'building to the downside',
              HOLD: 'stalling'}[s.verdict];
  var read = 'Momentum is <b>' + dirn + '</b> on the ' + KEY + ' chart. ' +
    'MACD sits ' + (d.hist >= 0 ? 'above' : 'below') + ' its signal line and has for ' +
    d.crossAge + ' ' + bar + (d.crossAge === 1 ? '' : 's') + ', price is ' +
    pct(d.maGap) + ' ' + (d.maGap >= 0 ? 'above' : 'below') + ' its 50-' + bar +
    ' average, and RSI is ' + F(d.rsi, 0) + '. ' +
    'Gold sits in the <b>' + o.bucket + '</b> zone, ' + s.proximity.now.drawdown +
    '% off its period high. Projected from the ' + fmtDate(s.asOf) + ' close of $' +
    F(spot, 0) + (Math.abs(DATA.spot - spot) > 0.5 ? ' (live: $' + F(DATA.spot, 0) + ')' : '') + '.';

  var rows = o.horizons.map(function(h){
    var b = o.bands[String(h)];
    if (!b) return '';
    var lo = spot * (1 + b.p10 / 100), mid = spot * (1 + b.p50 / 100), hi = spot * (1 + b.p90 / 100);
    // Scale the bar so the current price always has a place on it.
    var min = Math.min(lo, spot), max = Math.max(hi, spot), w = (max - min) || 1;
    var pos = function(v){ return ((v - min) / w * 100).toFixed(1) + '%'; };
    return '<div class="row">' +
      '<div class="lab"><span>next ' + h + unit + '</span>' +
        '<span>median <b>$' + F(mid, 0) + '</b> · ' + pct(b.p50) + '</span></div>' +
      '<div class="bar">' +
        '<div class="span" style="left:' + pos(lo) + ';right:' + (100 - parseFloat(pos(hi))).toFixed(1) + '%"></div>' +
        '<div class="now" style="left:' + pos(spot) + '"></div>' +
        '<div class="mid" style="left:' + pos(mid) + '"></div>' +
      '</div>' +
      '<div class="ends"><span>$' + F(lo, 0) + '</span>' +
        '<span>' + b.win + '% of cases finished higher · n=' + b.n + '</span>' +
        '<span>$' + F(hi, 0) + '</span></div>' +
    '</div>';
  }).join('');

  var sk = o.skill && o.skill.byState ? o.skill : null;
  var skillLine = '';
  if (sk){
    var parts = [];
    ['BUY','HOLD','SELL'].forEach(function(k){
      if (sk.byState[k]) parts.push(k + ' ' + pct(sk.byState[k].mean));
    });
    skillLine = ' Measured over the full record, the signal barely separates outcomes at all — ' +
      'mean ' + sk.horizon + unit + ' returns by state came out ' + parts.join(', ') +
      ', a spread of just <b>' + sk.spread + ' points</b>.';
  }

  return '<section class="hero">' +
    '<h2>Outlook</h2><div class="read">' + read + '</div>' +
    '<div class="cone">' + rows + '</div>' +
    '<div class="caveat"><b>This is a base rate, not a forecast.</b> The bands show where ' +
    'gold actually landed after the ' + o.matches + ' past setups matching today on <b>' +
    o.basis + '</b> — 10th to 90th percentile, with the marker at the median and the gold ' +
    'line at today’s price.' + skillLine +
    ' Band widths are corrected by the learning loop below, which is fitted on resolved predictions to hit 80% coverage.' +
    ' Nothing here predicts the price; the width of those bars is the honest answer.' +
    '</div></section>';
}

function proximity(s, bar){
  var p = s.proximity;
  if (!p || !p.table) return '';
  var unit = bar === 'week' ? 'w' : 'd';
  var base = p.baseline;

  var cellFor = function(f, b){
    if (!f) return '<td style="color:var(--dim)">–</td>';
    var strong = b && f.mean > b.mean;
    return '<td style="color:' + (strong ? 'var(--buy)' : 'var(--dim)') + '">' +
      (f.mean > 0 ? '+' : '') + f.mean.toFixed(1) + '</td>';
  };

  var rows = p.table.map(function(b){
    var here = b.label === p.now.bucket;
    var range = b.hi === null ? b.lo + '%+' : b.lo + '–' + b.hi + '%';
    var mark = b.stable === null ? '<span style="color:var(--dim)">–</span>'
             : b.stable ? '<span style="color:var(--buy)">✓</span>'
                        : '<span style="color:var(--sell)">✗</span>';
    return '<tr' + (here ? ' style="background:var(--card2)"' : '') + '>' +
      '<td>' + (here ? '<b style="color:var(--gold)">▸ ' + b.label + '</b>' : b.label) +
        '<br><small style="color:var(--dim)">' + range + ' off high' +
        (b.fwd.all ? ' · n=' + b.fwd.all.n : '') + '</small></td>' +
      cellFor(b.fwd.all, base.all) +
      cellFor(b.fwd.first, base.first) +
      cellFor(b.fwd.second, base.second) +
      '<td>' + mark + '</td></tr>';
  }).join('');

  var stable = 0, rated = 0;
  p.table.forEach(function(b){ if (b.stable !== null){ rated++; if (b.stable) stable++; } });
  var cur = null;
  p.table.forEach(function(b){ if (b.label === p.now.bucket) cur = b; });

  var note = 'Gold is <b>' + p.now.drawdown + '% off its period high</b> — the "' +
    p.now.bucket + '" zone' +
    (cur && cur.fwd.all ? ', which averaged <b>' + pct(cur.fwd.all.mean) + '</b> over the next ' +
      p.horizon + unit + ' against a ' + pct(base.all.mean) + ' baseline' : '') + '. ' +
    (cur && cur.stable === false
      ? '<b style="color:var(--sell)">That zone flips sides between the two halves of the record</b> — treat it as noise.'
      : cur && cur.stable
        ? 'It landed the same side of baseline in both halves, which is the weaker claim worth making.'
        : '');

  var caveat = 'Read the split columns, not the full-window one. Scored across all 25 years the ' +
    'zones decline neatly with depth and it looks like a law; scored per half, only <b>' + stable +
    ' of ' + rated + '</b> stay on the same side of their own era&rsquo;s baseline. The same test on ' +
    'silver, the S&amp;P and crude reorders the buckets entirely. Windows overlap heavily, so the ' +
    'effective sample is far smaller than n suggests.';

  return '<section class="card"><h2>Where gold sits · forward ' + p.horizon + unit + ' returns</h2>' +
    '<table><thead><tr><th>Zone</th><th>All</th><th>1st half</th><th>2nd half</th><th>Same?</th></tr></thead>' +
    '<tbody>' + rows +
    '<tr><td><b>Any ' + bar + '</b><br><small style="color:var(--dim)">baseline</small></td>' +
      '<td><b>' + (base.all ? pct(base.all.mean) : '–') + '</b></td>' +
      '<td style="color:var(--dim)">' + (base.first ? base.first.mean.toFixed(1) : '–') + '</td>' +
      '<td style="color:var(--dim)">' + (base.second ? base.second.mean.toFixed(1) : '–') + '</td>' +
      '<td></td></tr>' +
    '</tbody></table>' +
    '<div class="verdictline">' + note + '<br><br>' + caveat + '</div></section>';
}

function heatmap(s){
  var g = s.grid, t = s.test;
  if (!g || !g.matrix) return '';
  var hold = t.hold.cagr;
  // Colour by distance from buy-and-hold, so "nothing here beats it" is visible
  // at a glance rather than buried in the numbers.
  var lo = g.worst, hi = Math.max(g.best, hold);
  var cell = function(v, f, sl){
    if (v === null) return '<td class="na"></td>';
    var k = (v - lo) / ((hi - lo) || 1);
    var bg = 'hsl(' + Math.round(8 + k * 130) + ' 62% ' + Math.round(38 + k * 24) + '%)';
    var live = (f === DATA.params.fast && sl === DATA.params.slow) ? ' live' : '';
    return '<td class="' + live.trim() + '" style="background:' + bg + '">' + v.toFixed(1) + '</td>';
  };
  var head = '<tr><th></th>' + g.slow.map(function(x){ return '<th>' + x + '</th>'; }).join('') + '</tr>';
  var body = g.matrix.map(function(row, i){
    return '<tr><th>' + g.fast[i] + '</th>' +
      row.map(function(v, j){ return cell(v, g.fast[i], g.slow[j]); }).join('') + '</tr>';
  }).join('');

  var verdict;
  if (g.beatHold === 0){
    verdict = 'Not one of the ' + g.n + ' settings beat buy-and-hold (' + pct(hold) + '). ' +
      'They all land between ' + pct(g.worst) + ' and ' + pct(g.best) + ' — a spread of just ' +
      g.spread + ' points. <b>That tight clustering is the finding:</b> the result is stable, ' +
      'not curve-fit, so there is no setting to tune your way to an edge here.';
  } else {
    verdict = g.beatHold + ' of ' + g.n + ' settings beat buy-and-hold (' + pct(hold) + '), ' +
      'across a ' + g.spread + '-point spread. A broad cluster of winners suggests a real effect; ' +
      'one lone bright cell would suggest luck.';
  }

  return '<section class="card"><h2>Parameter sensitivity · position-rule CAGR</h2>' +
    '<table class="heat"><thead>' + head + '</thead><tbody>' + body + '</tbody></table>' +
    '<div class="axis">rows = fast EMA · columns = slow EMA · signal fixed at ' +
      DATA.params.signal + ' · gold outline = live setting</div>' +
    '<div class="verdictline">' + verdict + '<br>Your ' + DATA.params.fast + '/' +
      DATA.params.slow + '/' + DATA.params.signal + ' returns ' + pct(g.live) +
      ', ranking <b>' + g.liveRank + ' of ' + g.n + '</b> — ' +
      (g.liveRank <= g.n / 3 ? 'near the top of the range.'
        : g.liveRank >= g.n * 2 / 3 ? 'near the bottom of the range.'
        : 'squarely mid-pack, which is what a non-special setting looks like.') +
    '</div></section>';
}

function fmtDate(ts){
  return new Date(ts * 1000).toLocaleDateString('en-US', {month:'short', day:'numeric', year:'numeric'});
}

function learning(s, bar){
  var cal = s.outlook && s.outlook.calibration;
  if (!cal || !Object.keys(cal).length) return '';
  var unit = bar === 'week' ? 'w' : 'd';
  var sc = DATA.scorecard && DATA.scorecard[KEY];

  var rows = Object.keys(cal).sort(function(a, b){ return a - b; }).map(function(h){
    var c = cal[h];
    var gain = c.after - c.before;
    return '<tr><td>' + h + unit + '<br><small style="color:var(--dim)">n=' + c.n +
        ' resolved</small></td>' +
      '<td><b>' + c.k.toFixed(2) + '&times;</b></td>' +
      '<td style="color:var(--sell)">' + c.before + '%</td>' +
      '<td style="color:' + (Math.abs(c.after - 80) <= 10 ? 'var(--buy)' : 'var(--hold)') + '">' +
        c.after + '%</td>' +
      '<td style="color:var(--dim)">' + (gain > 0 ? '+' : '') + gain + '</td></tr>';
  }).join('');

  var proof = '';
  if (sc && sc.calibrated && sc.calibrated.n >= 10 && sc.uncalibrated && sc.uncalibrated.inBand !== null){
    proof = '<br><br><b>Live check:</b> ' + sc.calibrated.n + ' calls made with widened bands ' +
      'have landed in-band ' + sc.calibrated.inBand + '% of the time, against ' +
      sc.uncalibrated.inBand + '% for the ' + sc.uncalibrated.n + ' made before the loop existed.';
  } else if (sc && sc.calibrated){
    proof = '<br><br><b>Live check:</b> only ' + sc.calibrated.n + ' calls have been made with ' +
      'widened bands so far &mdash; not enough to confirm the correction holds going forward. ' +
      'That number grows on its own, and this row will say so either way.';
  }

  return '<section class="card"><h2>Learning loop &middot; band calibration</h2>' +
    '<table><thead><tr><th>Horizon</th><th>Widen</th><th>Was</th><th>Now</th><th>&Delta;</th></tr></thead>' +
    '<tbody>' + rows + '</tbody></table>' +
    '<div class="verdictline">Each resolved prediction feeds back into the band width. The ' +
    'factor is fitted to hit 80% coverage, shrunk toward 1&times; while the sample is thin so an ' +
    'early streak cannot swing it, and capped at 3&times;. Fitted on the first half of the record ' +
    'and applied to the unseen second half it lifted coverage from 69% to 88%, so the correction ' +
    'generalises rather than just fitting its own history.' + proof +
    '<br><br><b>What this cannot do:</b> it makes the uncertainty honest, not the call better. ' +
    'Direction accuracy is ' + (sc && sc.direction !== null ? sc.direction + '%' : 'near chance') +
    ' and no width adjustment moves it &mdash; a wider band says &ldquo;less certain&rdquo;, never ' +
    '&ldquo;more right&rdquo;.</div></section>';
}

function basisCard(){
  var b = DATA.basis;
  if (!b || !b.zones) return '';
  var z = b.zones[b.zone], base = b.baseline;
  var COL = {high: 'var(--buy)', low: 'var(--sell)', middle: 'var(--hold)'};
  var NAME = {high: 'Wide contango', low: 'Backwardation', middle: 'Neutral'};

  // Percentile drives the marker, so the reader sees where today sits in the
  // distribution rather than an unanchored decimal.
  var pos = Math.max(2, Math.min(98, b.percentile));

  var rows = ['high', 'middle', 'low'].map(function(k){
    var v = b.zones[k];
    if (!v) return '';
    var here = k === b.zone;
    return '<tr' + (here ? ' style="background:var(--card2)"' : '') + '>' +
      '<td>' + (here ? '<b style="color:' + COL[k] + '">\u25b8 ' + NAME[k] + '</b>' : NAME[k]) +
      '<br><small style="color:var(--dim)">n=' + v.n + '</small></td>' +
      '<td><b style="color:' + (v.mean > base.mean ? 'var(--buy)' : 'var(--dim)') + '">' +
        pct(v.mean) + '</b></td>' +
      '<td>' + v.win + '%</td>' +
      '<td style="color:var(--dim)">' + pct(v.p10) + '</td>' +
      '<td style="color:var(--dim)">' + pct(v.p90) + '</td></tr>';
  }).join('');

  var wf = b.walkForward;
  var proof = wf
    ? 'Walk-forward tested \u2014 with the zone threshold taken only from the trailing two ' +
      'years, high-basis days returned <b>' + pct(wf.high) + '</b> against <b>' + pct(wf.rest) +
      '</b> for everything else, a <b>' + wf.edge.toFixed(2) + 'pp</b> edge over ' + wf.n + ' days.'
    : '';

  return '<section class="card"><h2>Futures\u2013bullion basis \u00b7 ' + b.window +
      '-day average</h2>' +
    '<div class="zhead"><span style="color:var(--dim);font-size:12px">' +
      b.percentile + 'th percentile of the last 10 years</span>' +
      '<b style="color:' + COL[b.zone] + '">' + NAME[b.zone] + '</b></div>' +
    '<div class="zbar">' +
      '<div class="cut" style="left:20%"></div><div class="cut" style="left:80%"></div>' +
      '<div class="mk" style="left:' + pos + '%"></div></div>' +
    '<div class="zends"><span>backwardation</span><span>neutral</span><span>wide contango</span></div>' +

    '<table style="margin-top:14px"><thead><tr><th>Zone</th><th>Next ' + b.horizon + 'd</th>' +
      '<th>Win</th><th>p10</th><th>p90</th></tr></thead><tbody>' + rows +
      '<tr><td><b>Any day</b><br><small style="color:var(--dim)">baseline</small></td>' +
      '<td><b>' + pct(base.mean) + '</b></td><td>' + base.win + '%</td>' +
      '<td style="color:var(--dim)">' + pct(base.p10) + '</td>' +
      '<td style="color:var(--dim)">' + pct(base.p90) + '</td></tr>' +
    '</tbody></table>' +

    '<div class="verdictline">The ' + b.window + '-day average gap between the COMEX settle ' +
    'and the LBMA bullion fix has sat in the <b>' + NAME[b.zone].toLowerCase() + '</b> zone for ' +
    b.streak + ' session' + (b.streak === 1 ? '' : 's') + ' (' + b.avg.toFixed(3) + 'pp, ' +
    b.percentile + 'th percentile). Historically that zone was followed by <b>' + pct(z.mean) +
    '</b> in bullion over ' + b.horizon + ' sessions against a ' + pct(base.mean) + ' baseline.' +
    '<br><br>' + proof +
    '<br><br><b>Read this one carefully.</b> Wide contango being the bullish setup is the ' +
    'opposite of the usual scarcity story, and the edge is <b>absent in ' +
    (b.yearsTotal - b.yearsPositive) + ' of ' + b.yearsTotal + ' individual years</b>. ' +
    'Entry is measured from the <em>next</em> fix, not the one the basis was read against \u2014 ' +
    'without that delay the whole effect is just the fix being struck hours before the settle. ' +
    'Every reading is logged to the ledger and scored like any other call.</div>' +
    '</section>';
}

function scorecard(s, bar){
  var sc = DATA.scorecard && DATA.scorecard[KEY];
  if (!sc || !sc.n) return '';
  var unit = bar === 'week' ? 'w' : 'd';

  var rows = Object.keys(sc.horizons).sort(function(a, b){ return a - b; }).map(function(h){
    var v = sc.horizons[h];
    var off = Math.abs(v.inBand - 80);
    return '<tr><td>' + h + unit + '<br><small style="color:var(--dim)">n=' + v.n + '</small></td>' +
      '<td style="color:' + (off <= 10 ? 'var(--buy)' : off <= 20 ? 'var(--hold)' : 'var(--sell)') + '">' +
        v.inBand + '%</td>' +
      '<td>' + (v.direction === null ? '&ndash;' : v.direction + '%') + '</td>' +
      '<td style="color:var(--dim)">' + (v.medianError > 0 ? '+' : '') + v.medianError + '</td>' +
      '<td style="color:var(--dim)">' + v.meanAbsError + '</td></tr>';
  }).join('');

  var band = sc.inBand;
  var read;
  if (band < 70){
    read = 'The bands are <b>too narrow</b>. A calibrated 10th&ndash;90th range should swallow ' +
      'about 80% of outcomes; these caught <b>' + band + '%</b>, so gold moved outside the ' +
      'projected range far more often than the model expected &mdash; and it worsens with horizon.';
  } else if (band > 90){
    read = 'The bands are <b>too wide</b> &mdash; they caught ' + band + '% where 80% is the ' +
      'target, so they are technically right and practically useless.';
  } else {
    read = 'The bands are <b>reasonably calibrated</b>: they caught ' + band +
      '% of outcomes against an 80% target.';
  }

  var dirRead = sc.direction === null ? '' :
    ' Directional calls landed <b>' + sc.direction + '%</b> of the time across ' +
    sc.directionN + ' resolved BUY/SELL calls' +
    (sc.direction < 56 ? ', which is coin-flip territory.' : '.');

  return '<section class="card"><h2>Prediction scorecard &middot; ' + sc.n + ' resolved</h2>' +
    '<table><thead><tr><th>Horizon</th><th>In band</th><th>Direction</th><th>Med err</th>' +
    '<th>Avg err</th></tr></thead><tbody>' + rows + '</tbody></table>' +
    '<div class="verdictline">' + read + dirRead +
    '<br><br>Every call is logged automatically when the data rebuilds, and each horizon scores ' +
    'itself once its date arrives, so this record cannot be curated after the fact. Entries ' +
    'dated before today are a causal replay &mdash; the bands at each past bar were built only ' +
    'from data available at that bar. ' + sc.pending + ' horizons are still pending.' +
    '</div></section>';
}

/* ---- manual saves, kept on this device ---- */
var LS = 'goldsignal.saved.v1';

function loadSaved(){
  var raw;
  try { raw = JSON.parse(localStorage.getItem(LS)); } catch (e){ return []; }
  if (!Array.isArray(raw)) return [];
  // Coerce every field read back off the device: the stored blob is editable by
  // whoever owns the browser, and all of it is about to be interpolated.
  return raw.filter(function(e){ return e && typeof e === 'object'; }).map(function(e){
    return {
      timeframe: e.timeframe === 'daily' ? 'daily' : 'weekly',
      barTs: Number(e.barTs) || 0,
      made: Number(e.made) || 0,
      spot: Number(e.spot) || 0,
      verdict: safeVerdict(e.verdict),
      bucket: esc(e.bucket),
      bands: (e.bands && typeof e.bands === 'object') ? e.bands : {},
      dueAt: (e.dueAt && typeof e.dueAt === 'object') ? e.dueAt : {},
      results: (e.results && typeof e.results === 'object') ? e.results : {}
    };
  });
}
function writeSaved(a){
  try { localStorage.setItem(LS, JSON.stringify(a)); } catch (e){}
}

function savePrediction(){
  var s = DATA[KEY], o = s.outlook;
  var all = loadSaved();
  var barTs = s.candles[s.candles.length - 1].t;
  if (all.some(function(x){ return x.timeframe === KEY && x.barTs === barTs; })){
    alert('This ' + KEY + ' bar is already saved.');
    return;
  }
  var secs = Math.round(365.25 * 24 * 3600 / (KEY === 'weekly' ? 52 : 252));
  var due = {};
  Object.keys(o.bands).forEach(function(h){ due[h] = barTs + parseInt(h, 10) * secs; });
  all.push({
    timeframe: KEY, barTs: barTs, made: Math.floor(Date.now() / 1000),
    spot: DATA.spot, verdict: s.verdict, bucket: o.bucket,
    bands: o.bands, dueAt: due, results: {}
  });
  writeSaved(all);
  render();
}

function checkSaved(){
  var all = loadSaved(), now = Math.floor(Date.now() / 1000), n = 0;
  all.forEach(function(e){
    Object.keys(e.dueAt).forEach(function(h){
      // Only horizons whose date has actually passed resolve, and a resolved
      // horizon is never rewritten.
      if (e.results[h] || e.dueAt[h] > now) return;
      var ret = (DATA.spot - e.spot) / e.spot * 100;
      var b = e.bands[h];
      e.results[h] = {
        actual: DATA.spot, ret: Math.round(ret * 100) / 100, at: now,
        inBand: ret >= b.p10 && ret <= b.p90,
        direction: e.verdict === 'BUY' ? ret > 0 : e.verdict === 'SELL' ? ret < 0 : null,
        error: Math.round((ret - b.p50) * 100) / 100
      };
      n++;
    });
  });
  writeSaved(all);
  render();
  alert(n ? 'Resolved ' + n + ' horizon' + (n === 1 ? '' : 's') + '.'
          : 'Nothing is due yet. Check back once a horizon date passes.');
}

function deleteSaved(i){
  var all = loadSaved();
  all.splice(i, 1);
  writeSaved(all);
  render();
}

function entryLine(e, unit, mine){
  var due = Object.keys(e.dueAt).sort(function(a, b){ return a - b; });
  var parts = due.map(function(h){
    var r = e.results[h];
    if (!r) return '<span class="pend">' + h + unit + ' due ' + fmtDate(e.dueAt[h]) + '</span>';
    return '<span class="' + (r.inBand ? 'ok' : 'bad') + '">' + h + unit + ' ' +
      (r.ret > 0 ? '+' : '') + r.ret.toFixed(1) + '% ' +
      (r.inBand ? 'in band' : 'outside band') +
      (r.direction === null ? '' : r.direction ? ' &middot; called right' : ' &middot; called wrong') +
      '</span>';
  });
  var tag = e.backfilled ? '<span class="tag">replay</span>'
          : mine ? '<span class="tag">saved</span>' : '';
  var v = safeVerdict(e.verdict);
  return '<div class="top"><b style="color:' + COLOR[v] + '">' + v + '</b>' +
      '<span class="when">$' + F(e.spot, 0) + ' &middot; ' + fmtDate(e.barTs) + tag + '</span></div>' +
    '<div class="res">' + parts.join('<br>') + '</div>';
}

function saved(s, bar){
  var unit = bar === 'week' ? 'w' : 'd';
  var mine = loadSaved().filter(function(e){ return e.timeframe === KEY; });
  var auto = (DATA.recent || []).filter(function(e){
    return e.timeframe === KEY || e.timeframe === 'basis';
  }).slice(0, 6);

  var mineHtml = mine.length
    ? '<ul class="log">' + mine.map(function(e, i){
        return '<li>' + entryLine(e, unit, true) +
          '<div style="margin-top:6px"><a href="#" onclick="deleteSaved(' + i +
          ');return false" style="color:var(--dim);font-size:11.5px">remove</a></div></li>';
      }).join('') + '</ul>'
    : '<div style="color:var(--dim);font-size:13px">Nothing saved on this device yet. ' +
      'Saving pins the current call and its bands so you can score them later.</div>';

  return '<section class="card"><h2>Save &amp; verify</h2>' + mineHtml +
    '<div class="btnrow">' +
      '<button type="button" class="btn primary" onclick="savePrediction()">Save this ' +
        KEY + ' call</button>' +
      '<button type="button" class="btn" onclick="checkSaved()">Check what is due</button>' +
    '</div>' +
    (auto.length ? '<h2 style="margin-top:22px">Auto-logged calls</h2><ul class="log">' +
      auto.map(function(e){ return '<li>' + entryLine(e, unit, false) + '</li>'; }).join('') +
      '</ul>' : '') +
    '<div class="verdictline">Saved calls live in this browser only. The auto-logged ledger is ' +
    'committed to the repo on every rebuild and is the one that counts &mdash; it records every ' +
    'call whether it turns out well or badly, which a button you press by choice cannot.' +
    '</div></section>';
}

/* --- inline charts: no libraries, no network --- */
var W = 600, H = 150, PAD = 5;

function scaler(vals){
  var lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals);
  var span = (hi - lo) || 1;
  return function(v){ return PAD + (hi - v) / span * (H - PAD * 2); };
}

function poly(vals, y, dx, off){
  var pts = [];
  for (var i = 0; i < vals.length; i++){
    if (vals[i] === null || vals[i] === undefined) continue;
    pts.push((i * dx + off).toFixed(1) + ',' + y(vals[i]).toFixed(1));
  }
  return pts.join(' ');
}

function priceChart(candles){
  var cs = candles.map(function(c){ return c.c; });
  var as = candles.map(function(c){ return c.a; });
  var known = as.filter(function(v){ return v !== null && v !== undefined; });
  var y = scaler(cs.concat(known));
  var dx = W / (candles.length - 1);
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" height="150">' +
    '<polyline points="' + poly(as, y, dx, 0) + '" fill="none" stroke="var(--blue)" ' +
      'stroke-width="1.5" vector-effect="non-scaling-stroke"/>' +
    '<polyline points="' + poly(cs, y, dx, 0) + '" fill="none" stroke="var(--gold)" ' +
      'stroke-width="2" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg>';
}

function histChart(candles){
  var rows = candles.filter(function(c){ return c.h !== null && c.h !== undefined; });
  if (!rows.length) return '';
  var y = scaler(rows.map(function(c){ return c.h; }).concat([0]));
  var zero = y(0), bw = W / rows.length, bars = '';
  rows.forEach(function(c, i){
    var yy = y(c.h);
    bars += '<rect x="' + (i * bw).toFixed(2) + '" y="' + Math.min(yy, zero).toFixed(1) +
      '" width="' + Math.max(bw - 0.6, 0.6).toFixed(2) +
      '" height="' + Math.max(Math.abs(zero - yy), 0.8).toFixed(1) +
      '" fill="' + (c.h >= 0 ? 'var(--buy)' : 'var(--sell)') +
      '" opacity="' + (i === rows.length - 1 ? '1' : '.7') + '"/>';
  });
  var ms = rows.map(function(c){ return c.m; });
  var ss = rows.map(function(c){ return c.s; });
  var y2 = scaler(ms.concat(ss));
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" height="150">' + bars +
    '<line x1="0" x2="' + W + '" y1="' + zero.toFixed(1) + '" y2="' + zero.toFixed(1) +
      '" stroke="var(--line)" stroke-width="1" vector-effect="non-scaling-stroke"/>' +
    '<polyline points="' + poly(ms, y2, bw, bw / 2) + '" fill="none" stroke="var(--blue)" ' +
      'stroke-width="1.5" vector-effect="non-scaling-stroke"/>' +
    '<polyline points="' + poly(ss, y2, bw, bw / 2) + '" fill="none" stroke="#f59e0b" ' +
      'stroke-width="1.5" vector-effect="non-scaling-stroke"/></svg>';
}
</script>
